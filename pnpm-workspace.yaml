packages:
  - "apps/*"
  - "packages/*"

# Native build scripts pnpm's supply-chain safety check asks about on
# install. All five are well-known, necessary native steps (Prisma's engine
# download/client generation, argon2's native hashing binding, esbuild's
# native binary, and unrs-resolver as esbuild's own transitive dependency),
# not something to be suspicious of.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  unrs-resolver: true
